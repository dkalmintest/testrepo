# Transform Content runs a go module that handles transforming content
# and uploads to AFD unless CONTENT_ENV_LOCKED is set to locked.

name: Transform Content
permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to resolve the source SHA label from
        required: false
  push:
    branches: [ "main" ]
    paths:
      - "content/**"
  pull_request:
    paths:
      - "content/**"

jobs:
  Build-Test-Transform:
    name: Build-Test-Transform-Upload
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    env:
      STORAGE_ACCOUNT_NAME_ENV: ${{vars.STORAGE_ACCOUNT_NAME}}
      STORAGE_ACCOUNT_BLOB_CONTAINER_NAME_ENV: ${{vars.STORAGE_ACCOUNT_BLOB_CONTAINER_NAME}}
      CONTENT_ENV_LOCKED: ${{vars.CONTENT_ENV_LOCKED}}
      INITIAL_CONTENT_ENV_LOCKED: ${{vars.CONTENT_ENV_LOCKED}}
      AZCOPY_AUTO_LOGIN_TYPE: AZCLI

    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: transformer/go.mod

    - name: Include Markdown
      working-directory: ./transformer/markdown-includer
      run: node includeMarkdown.js ../../content

    - name: Transform
      working-directory: ./transformer
      run: go run main.go --input ../content --output ../output

    - name: Upload HTML Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: transformer
        path: ./output

    - name: Resolve source SHA
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER_INPUT: ${{ inputs.pr_number }}
      run: |
        SOURCE_SHA="$GITHUB_SHA"
        PR_NUMBER="$PR_NUMBER_INPUT"
        if [[ -z "$PR_NUMBER" && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          PR_NUMBER="${{ github.event.pull_request.number }}"
        fi

        if [[ -n "$PR_NUMBER" && -n "$GH_TOKEN" ]]; then
          SOURCE_SHA_FROM_LABEL="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[] | select(.name | startswith("sha-")) | .name | sub("^sha-"; "")' | head -n 1)"
          if [[ "$SOURCE_SHA_FROM_LABEL" =~ ^[0-9a-fA-F]{40}$ ]]; then
            SOURCE_SHA="$SOURCE_SHA_FROM_LABEL"
          fi
        fi

        if [[ -n "$PR_NUMBER" && -n "$GH_TOKEN" && "$SOURCE_SHA" == "$GITHUB_SHA" ]]; then
          SOURCE_SHA_LABEL="sha-$SOURCE_SHA"
          if gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=$SOURCE_SHA_LABEL" >/dev/null; then
            echo "Added missing source SHA label to PR #$PR_NUMBER: $SOURCE_SHA_LABEL"
          else
            echo "Failed to add missing source SHA label to PR #$PR_NUMBER: $SOURCE_SHA_LABEL"
          fi
        fi

        echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
        echo "Resolved source SHA: $SOURCE_SHA"

    - name: Detect initial lock state
      shell: bash
      run: |
        echo "INITIAL_CONTENT_ENV_LOCK_MATCHES_RUN=false" >> "$GITHUB_ENV"
        if [[ "$INITIAL_CONTENT_ENV_LOCKED" == "notlocked" ]]; then
          echo "INITIAL_CONTENT_ENV_LOCK_STATE=notlocked" >> "$GITHUB_ENV"
          echo "Initial CONTENT_ENV_LOCKED is explicitly notlocked and is allowed to deploy."
        elif [[ "$INITIAL_CONTENT_ENV_LOCKED" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "INITIAL_CONTENT_ENV_LOCK_STATE=sha-locked" >> "$GITHUB_ENV"
          echo "Initial CONTENT_ENV_LOCKED contains lock SHA: $INITIAL_CONTENT_ENV_LOCKED"
          if [[ "$INITIAL_CONTENT_ENV_LOCKED" == "$SOURCE_SHA" ]]; then
            echo "INITIAL_CONTENT_ENV_LOCK_MATCHES_RUN=true" >> "$GITHUB_ENV"
            echo "Initial lock SHA matches this run source SHA and is allowed to deploy."
          fi
        else
          echo "INITIAL_CONTENT_ENV_LOCK_STATE=notlocked" >> "$GITHUB_ENV"
          echo "Initial CONTENT_ENV_LOCKED is not a recognized lock value and is treated as unlocked: $INITIAL_CONTENT_ENV_LOCKED"
        fi

    # Removed: Lock content publish outside main
    # The CONTENT_ENV_LOCKED value should always come from the deploy-trigger workflow (PR label SHA)

    - name: Skip content publish while environment is SHA-locked
      if: ${{ env.INITIAL_CONTENT_ENV_LOCK_STATE == 'sha-locked' && env.INITIAL_CONTENT_ENV_LOCK_MATCHES_RUN != 'true' && !(github.event_name == 'push' && github.ref_name == 'main') }}
      run: echo "Content publish skipped because CONTENT_ENV_LOCKED is SHA-locked for a different source SHA in this environment."

    - name: Azure login
      if: ${{ env.INITIAL_CONTENT_ENV_LOCK_STATE != 'sha-locked' || env.INITIAL_CONTENT_ENV_LOCK_MATCHES_RUN == 'true' || (github.event_name == 'push' && github.ref_name == 'main') }}
      uses: azure/login@v3
      with:
        client-id: ${{vars.AZURE_AD_CLIENT_ID}}
        tenant-id: ${{vars.AZURE_AD_TENANT_ID}}
        subscription-id: ${{vars.AZURE_SUBSCRIPTION_ID}}

    - name: Lock content environment for this publish
      if: ${{ env.INITIAL_CONTENT_ENV_LOCK_STATE != 'sha-locked' || env.INITIAL_CONTENT_ENV_LOCK_MATCHES_RUN == 'true' || (github.event_name == 'push' && github.ref_name == 'main') }}
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        echo "CONTENT_ENV_LOCKED=$SOURCE_SHA" >> "$GITHUB_ENV"
        if [[ -n "$GH_TOKEN" ]]; then
          gh variable set CONTENT_ENV_LOCKED --body "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY"
          echo "Repository variable CONTENT_ENV_LOCKED set to $SOURCE_SHA for this publish."
        else
          echo "PAT_TOKEN is not available; repository variable CONTENT_ENV_LOCKED was not updated for this publish."
        fi
          
    - name: Copy Content to Azure Storage
      if: ${{ env.INITIAL_CONTENT_ENV_LOCK_STATE != 'sha-locked' || env.INITIAL_CONTENT_ENV_LOCK_MATCHES_RUN == 'true' || (github.event_name == 'push' && github.ref_name == 'main') }}
      run: |
        azcopy sync ./output \
                     "https://$STORAGE_ACCOUNT_NAME_ENV.blob.core.windows.net/$STORAGE_ACCOUNT_BLOB_CONTAINER_NAME_ENV/" \
                     --recursive \
                     --delete-destination=true \
                     --compare-hash=md5

    - name: Unlock content environment after successful main publish
      if: ${{ github.event_name == 'push' && github.ref_name == 'main' && success() }}
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        echo "CONTENT_ENV_LOCKED=notlocked" >> "$GITHUB_ENV"
        echo "CONTENT_ENV_LOCKED_PRODUCTION=$SOURCE_SHA" >> "$GITHUB_ENV"
        if [[ -n "$GH_TOKEN" ]]; then
          gh variable set CONTENT_ENV_LOCKED --body notlocked --repo "$GITHUB_REPOSITORY"
          gh variable set CONTENT_ENV_LOCKED_PRODUCTION --body "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY"
          echo "Repository variable CONTENT_ENV_LOCKED set to notlocked after successful main publish."
          echo "Repository variable CONTENT_ENV_LOCKED_PRODUCTION set to $SOURCE_SHA after successful main publish."
        else
          echo "PAT_TOKEN is not available; repository variables CONTENT_ENV_LOCKED and CONTENT_ENV_LOCKED_PRODUCTION were not updated after successful main publish."
        fi