# Transform Content runs a go module that handles transforming content
# and uploads to AFD.

name: CI Learn
permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      deploy_content:
        description: Deploy Content
        required: false
        type: boolean
        default: true
      deploy_environment:
        description: 'Override deployment environment'
        required: false
        type: choice
        options:
          - staging
          - production
  push:
    branches: [ "main" ]
    paths:
      - "content/**"
      - "layouts/shortcodes/**"
  pull_request:
    branches:
      - main
    paths:
      - "content/**"
      - "layouts/shortcodes/**"

jobs:
  Build-Test-Transform:
    uses: github/cse-content-engine/.github/workflows/transform-build.yml@main
    secrets:
      PAT_TOKEN_CSE: ${{ secrets.PAT_TOKEN_CSE }}

  deploy-content:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_content }}
    needs:
      - Build-Test-Transform
    uses: github/cse-content-engine/.github/workflows/transform-deploy.yml@main
    with:
      deploy_environment: ${{ inputs.deploy_environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      storage_account_name: ${{ (inputs.deploy_environment || (github.ref_name == 'main' && 'production' || 'staging')) == 'production' && vars.CE_STORAGE_ACCOUNT_NAME_PROD || vars.CE_STORAGE_ACCOUNT_NAME }}
      azure_client_id: ${{ (inputs.deploy_environment || (github.ref_name == 'main' && 'production' || 'staging')) == 'production' && vars.CE_AZURE_AD_CLIENT_ID_PROD || vars.CE_AZURE_AD_CLIENT_ID }}
      azure_tenant_id: ${{ (inputs.deploy_environment || (github.ref_name == 'main' && 'production' || 'staging')) == 'production' && vars.CE_AZURE_AD_TENANT_ID_PROD || vars.CE_AZURE_AD_TENANT_ID }}
      azure_subscription_id: ${{ (inputs.deploy_environment || (github.ref_name == 'main' && 'production' || 'staging')) == 'production' && vars.CE_AZURE_AD_SUBSCRIPTION_ID_PROD || vars.CE_AZURE_AD_SUBSCRIPTION_ID }}

  comment-pr-success:
    needs:
      - deploy-content
    if: ${{ needs.deploy-content.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment on successful deployment
        uses: actions/github-script@v7
        env:
          DEPLOY_ENV: ${{ inputs.deploy_environment || (github.ref_name == 'main' && 'production' || 'staging') }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deploymentUrl = process.env.DEPLOY_ENV === 'production'
              ? 'https://learn.github.com/well-architected'
              : 'https://learn-staging.githubapp.com/well-architected';

            let prNumber = context.payload.pull_request?.number;

            if (!prNumber) {
              const branchName = context.ref.replace('refs/heads/', '');
              const { data: pullRequests } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branchName}`,
                per_page: 1
              });
              prNumber = pullRequests[0]?.number;
            }

            if (!prNumber) {
              core.info('No open PR is associated with this branch. Skipping PR comment.');
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `Success! View your deployment: ${deploymentUrl}`
            });
