# Transform Content runs a go module that handles transforming content
# and uploads to AFD unless CONTENT_ENV_LOCKED is set to locked.

name: Transform Content Local
permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to resolve the source SHA label from
        required: false
  push:
    branches: [ "main" ]
    paths:
      - "content/**"
  pull_request:
    paths:
      - "content/**"

jobs:
  resolve-source-sha:
    uses: ./.github/workflows/resolve-source-sha.yml
    with:
      pr_number: ${{ inputs.pr_number || github.event.pull_request.number || '' }}
      event_name: ${{ github.event_name }}
      github_sha: ${{ github.sha }}
      pr_action: ${{ github.event.action || '' }}
      pr_creator_login: ${{ github.event.pull_request.user.login || '' }}
      pr_head_sha: ${{ github.event.pull_request.head.sha || '' }}

  detect-initial-lock-state:
    needs: resolve-source-sha
    uses: ./.github/workflows/detect-initial-lock-state.yml
    with:
      initial_content_env_locked: ${{ vars.CONTENT_ENV_LOCKED }}
      source_sha: ${{ needs.resolve-source-sha.outputs.source_sha }}
      previous_source_sha: ${{ needs.resolve-source-sha.outputs.previous_source_sha }}

  Build-Test-Transform:
    needs:
      - resolve-source-sha
      - detect-initial-lock-state
    name: Build-Test-Transform-Upload
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    env:
      STORAGE_ACCOUNT_NAME_ENV: ${{vars.STORAGE_ACCOUNT_NAME}}
      STORAGE_ACCOUNT_BLOB_CONTAINER_NAME_ENV: ${{vars.STORAGE_ACCOUNT_BLOB_CONTAINER_NAME}}
      CONTENT_ENV_LOCKED: ${{vars.CONTENT_ENV_LOCKED}}
      INITIAL_CONTENT_ENV_LOCKED: ${{vars.CONTENT_ENV_LOCKED}}
      AZCOPY_AUTO_LOGIN_TYPE: AZCLI
      SOURCE_SHA: ${{ needs.resolve-source-sha.outputs.source_sha }}
      SOURCE_SHA_ORIGIN: ${{ needs.resolve-source-sha.outputs.source_sha_origin }}
      PREVIOUS_SOURCE_SHA: ${{ needs.resolve-source-sha.outputs.previous_source_sha }}
      INITIAL_CONTENT_ENV_LOCK_STATE: ${{ needs.detect-initial-lock-state.outputs.initial_content_env_lock_state }}
      INITIAL_CONTENT_ENV_LOCK_MATCHES_RUN: ${{ needs.detect-initial-lock-state.outputs.initial_content_env_lock_matches_run }}
      INITIAL_CONTENT_ENV_LOCK_MATCHES_PREVIOUS_SHA: ${{ needs.detect-initial-lock-state.outputs.initial_content_env_lock_matches_previous_sha }}

    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: transformer/go.mod

    - name: Include Markdown
      run: echo "Skipping markdown inclusion in local workflow."

    - name: Transform
      run: echo "Skipping transform in local workflow."

    - name: Upload HTML Artifacts
      run: echo "Skipping HTML artifact upload in local workflow."

    # Removed: Lock content publish outside main
    # The CONTENT_ENV_LOCKED value should always come from the deploy-trigger workflow (PR label SHA)

    - name: Skip content publish while environment is SHA-locked
      if: ${{ env.INITIAL_CONTENT_ENV_LOCK_STATE == 'sha-locked' && env.INITIAL_CONTENT_ENV_LOCK_MATCHES_RUN != 'true' && env.INITIAL_CONTENT_ENV_LOCK_MATCHES_PREVIOUS_SHA != 'true' && !(github.event_name == 'push' && github.ref_name == 'main') }}
      run: echo "Content publish skipped because CONTENT_ENV_LOCKED is SHA-locked for a different source SHA in this environment."

  lock-content-environment:
    needs:
      - resolve-source-sha
      - detect-initial-lock-state
      - Build-Test-Transform
    if: ${{ needs.detect-initial-lock-state.outputs.initial_content_env_lock_state != 'sha-locked' || needs.detect-initial-lock-state.outputs.initial_content_env_lock_matches_run == 'true' || needs.detect-initial-lock-state.outputs.initial_content_env_lock_matches_previous_sha == 'true' || (github.event_name == 'push' && github.ref_name == 'main') }}
    uses: ./.github/workflows/lock-content-environment.yml
    with:
      source_sha: ${{ needs.resolve-source-sha.outputs.source_sha }}
    secrets: inherit

  deploy-content:
    needs:
      - resolve-source-sha
      - detect-initial-lock-state
      - Build-Test-Transform
      - lock-content-environment
    if: ${{ needs.detect-initial-lock-state.outputs.initial_content_env_lock_state != 'sha-locked' || needs.detect-initial-lock-state.outputs.initial_content_env_lock_matches_run == 'true' || needs.detect-initial-lock-state.outputs.initial_content_env_lock_matches_previous_sha == 'true' || (github.event_name == 'push' && github.ref_name == 'main') }}
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        run: echo "Skipping Azure login in local workflow."

      - name: Copy Content to Azure Storage
        run: echo "Skipping Azure Storage sync in local workflow."

  unlock-content-environment-main:
    needs:
      - resolve-source-sha
      - deploy-content
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && needs.deploy-content.result == 'success' }}
    uses: ./.github/workflows/unlock-content-environment-main.yml
    with:
      source_sha: ${{ needs.resolve-source-sha.outputs.source_sha }}
    secrets: inherit