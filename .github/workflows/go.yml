# Transform Content runs a go module that handles transforming conent 
# and uploading to the AFD

name: Transform Content

on:
  workflow_dispatch:
#  push:
#    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]

jobs:

  Build-and-Test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./transformer
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      run: go build -v -o transformer main.go

    - name: Test
      run: go test ./... -v

    - name: Transform
      run: ./transformer
      
    - name: Publish transformer
      uses: actions/upload-artifact@v5
      with:
        name: transformer
        path: /home/runner/work/testrepo/testrepo/transformer/transformer
      

